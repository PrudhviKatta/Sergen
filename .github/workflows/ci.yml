name: backend-ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resume-ai/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ubuntu-latest ships Docker preinstalled, so Testcontainers (used by
      # the *IT integration tests) works with no extra setup.
      - name: mvn verify
        run: mvn -B verify
