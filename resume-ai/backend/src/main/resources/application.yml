spring:
  application:
    name: resume-ai-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resumeai}
    username: ${DB_USER:resumeai}
    password: ${DB_PASSWORD:resumeai}

  jpa:
    # Flyway owns the schema; Hibernate only validates the mapping matches it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Milestone 2: Spring's default (1MB) is too small for a real resume upload.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

# §26/§49: no default - embedding calls fail with a clear error (not at
# startup) until OPENAI_API_KEY is set. See docs/IMPLEMENTATION_NOTES.md.
openai:
  api-key: ${OPENAI_API_KEY:}
  embedding-model: text-embedding-3-small
  chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}

logging:
  level:
    com.company.resumeai: INFO
