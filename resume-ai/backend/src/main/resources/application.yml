spring:
  application:
    name: resume-ai-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resumeai}
    username: ${DB_USER:resumeai}
    password: ${DB_PASSWORD:resumeai}

  jpa:
    # Flyway owns the schema; Hibernate only validates the mapping matches it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.company.resumeai: INFO
