server {
    listen 80;

    # Same reason as vite.config.ts's dev-server proxy: the app calls a
    # relative /api/v1/... path, so whatever serves the built bundle has to
    # forward it to the backend - no CORS configuration needed either side.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
